---
name: node-exporter

instance_groups:
  - name: node-exporter
    azs:
      - z1
    instances: 1
    vm_type: default
    stemcell: default
    networks:
      - name: default
    jobs:
      - name: node_exporter
        release: node-exporter

update:
  canaries: 1
  max_in_flight: 32
  canary_watch_time: 1000-30000
  update_watch_time: 1000-30000
  serial: false

stemcells:
  - alias: default
    os: ubuntu-jammy
    version: latest

releases:
- name: node-exporter
  version: 5.8.0
  url: https://github.com/cloudfoundry/node-exporter-boshrelease/releases/download/v5.8.0/node-exporter-5.8.0.tgz
  sha1: 91d48703b6d0ead2530dd2616f76860992d0eeb8
